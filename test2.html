```html
<body class="bg-gray-200 min-h-screen p-10">

<div class="max-w-6xl mx-auto">

    <!-- FORM -->
    <form id="financialForm"
    class="bg-white p-10 shadow-2xl rounded">

        <!-- HEADER -->
        <div class="flex items-center justify-between border-b-4 border-[#04045d] pb-5 mb-10">

            <div class="flex items-center gap-4">

                <img src="logo/logo1.jpg"
                class="w-24 h-24 object-contain">

                <div>

                    <h1 class="text-4xl font-black text-[#04045d]">
                        DOBN CAPITAL
                    </h1>

                    <p class="text-gray-500 tracking-widest text-sm">
                        INVESTMENT POLICY STATEMENT
                    </p>

                </div>

            </div>

        </div>

        <!-- CLIENT INFO -->
        <div class="mb-10">

            <h2 class="text-2xl font-bold text-[#04045d] border-b-2 border-[#04045d] pb-2 mb-6">
                THÔNG TIN KHÁCH HÀNG
                <span class="text-gray-500 text-lg">
                    (CLIENT'S INFORMATION)
                </span>
            </h2>

            <div class="grid grid-cols-2 gap-6">

                <div>
                    <label class="font-semibold">
                        Họ và tên (NAME)
                    </label>

                    <input type="text"
                    id="custName"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">
                        SỐ CCCD (ID)
                    </label>

                    <input type="text"
                    id="custID"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">
                        QUỐC TỊCH (NATIONALITY)
                    </label>

                    <select id="custNationality"
                    class="w-full border p-3 mt-2 rounded">

                        <option>Vietnam</option>
                        <option>Singapore</option>
                        <option>Thailand</option>
                        <option>Malaysia</option>
                        <option>Japan</option>
                        <option>Korea</option>
                        <option>United States</option>

                    </select>
                </div>

                <div>
                    <label class="font-semibold">
                        EMAIL
                    </label>

                    <input type="email"
                    id="custEmail"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">
                        SỐ ĐIỆN THOẠI (PHONE)
                    </label>

                    <input type="text"
                    id="custPhone"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label class="font-semibold">
                        ĐỊA CHỈ (ADDRESS)
                    </label>

                    <input type="text"
                    id="custAddress"
                    class="w-full border p-3 mt-2 rounded">
                </div>

            </div>

        </div>

        <!-- FINANCIAL -->
        <div class="mb-10">

            <h2 class="text-2xl font-bold text-[#04045d] border-b-2 border-[#04045d] pb-2 mb-6">
                TÌNH HÌNH TÀI CHÍNH CỦA KHÁCH HÀNG
            </h2>

            <!-- ASSETS -->
            <div class="mb-8">

                <h3 class="font-bold text-xl mb-4 text-[#04045d]">
                    TÀI SẢN (ASSETS)
                </h3>

                <div class="grid grid-cols-2 gap-6">

                    <div>
                        <label>Tiền mặt (Cash)</label>
                        <input type="number" id="cash"
                        class="w-full border p-3 mt-2 rounded">
                    </div>

                    <div>
                        <label>Tiết kiệm (Saving)</label>
                        <input type="number" id="saving"
                        class="w-full border p-3 mt-2 rounded">
                    </div>

                    <div>
                        <label>Tài sản cố định</label>
                        <input type="number" id="fixedAssets"
                        class="w-full border p-3 mt-2 rounded">
                    </div>

                    <div>
                        <label>Tài sản khác</label>
                        <input type="number" id="otherAssets"
                        class="w-full border p-3 mt-2 rounded">
                    </div>

                </div>

            </div>

            <!-- LIABILITIES -->
            <div class="mb-8">

                <h3 class="font-bold text-xl mb-4 text-[#04045d]">
                    NỢ PHẢI TRẢ (LIABILITIES)
                </h3>

                <div class="grid grid-cols-2 gap-6">

                    <div>
                        <label>Nợ ngắn hạn</label>
                        <input type="number" id="shortDebt"
                        class="w-full border p-3 mt-2 rounded">
                    </div>

                    <div>
                        <label>Nợ dài hạn</label>
                        <input type="number" id="longDebt"
                        class="w-full border p-3 mt-2 rounded">
                    </div>

                </div>

            </div>

            <!-- INCOME -->
            <div class="grid grid-cols-2 gap-6">

                <div>
                    <label>Thu nhập hàng tháng</label>
                    <input type="number" id="monthlyIncome"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label>Chi phí hàng tháng</label>
                    <input type="number" id="monthlyExpense"
                    class="w-full border p-3 mt-2 rounded">
                </div>

            </div>

        </div>

        <!-- INVESTMENT -->
        <div class="mb-10">

            <h2 class="text-2xl font-bold text-[#04045d] border-b-2 border-[#04045d] pb-2 mb-6">
                KHẢO SÁT KHẨU VỊ RỦI RO
            </h2>

            <div class="grid grid-cols-3 gap-6 mb-8">

                <div>
                    <label>Mức chấp nhận rủi ro (%)</label>

                    <input type="number"
                    id="riskPercent"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label>Lợi suất kỳ vọng (%)</label>

                    <input type="number"
                    id="expectedReturn"
                    class="w-full border p-3 mt-2 rounded">
                </div>

                <div>
                    <label>Thời gian đầu tư</label>

                    <select id="investmentHorizon"
                    class="w-full border p-3 mt-2 rounded">

                        <option>Short Term</option>
                        <option>Medium Term</option>
                        <option>Long Term</option>

                    </select>
                </div>

            </div>

        </div>

        <!-- QUESTIONS -->
        <div>

            <h2 class="text-2xl font-bold text-[#04045d] border-b-2 border-[#04045d] pb-2 mb-6">
                BẢNG ĐÁNH GIÁ KHẢ NĂNG CHẤP NHẬN RỦI RO
            </h2>

            <div class="space-y-8">

                <!-- QUESTION TEMPLATE -->
                <div>
                    <p class="font-bold mb-3">
                        1. Mục tiêu đầu tư của bạn là gì?
                    </p>

                    <select class="risk-question w-full border p-3 rounded">

                        <option value="1">
                            Bảo toàn vốn và tránh rủi ro
                        </option>

                        <option value="2">
                            Tăng trưởng vốn ổn định
                        </option>

                        <option value="3">
                            Tăng trưởng vốn nhanh
                        </option>

                        <option value="4">
                            Tìm kiếm lợi nhuận cực cao
                        </option>

                    </select>
                </div>

                <!-- COPY THÊM 7 CÂU TƯƠNG TỰ -->

            </div>

        </div>

        <!-- BUTTON -->
        <div class="mt-10">

            <button type="submit"
            class="w-full bg-[#04045d] text-white py-4 rounded text-xl font-bold hover:opacity-90">

                XUẤT INVESTMENT POLICY STATEMENT (PDF)

            </button>

        </div>

    </form>

</div>

</body>
```
